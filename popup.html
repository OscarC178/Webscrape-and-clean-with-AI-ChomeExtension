<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg-main: #fefdf5; /* Soft yellow background */
      --text-main: #3d524f; /* Dark muted green */
      --accent-green: #5a7d7c; /* Muted green for AI toggle/buttons */
      --accent-green-hover: #4b6867;
      --border-color: #e0e0d1;
      --invalid-bg: #ffe8e8;
      --invalid-text: #c0392b;
      --focus-ring: #f1c40f; /* Brighter yellow for focus */
    }
    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 15px;
      background-color: var(--bg-main);
      color: var(--text-main);
    }
    .header {
      text-align: center;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .header img {
      width: 40px;
      height: 40px;
    }
    .header h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
    }
    #urlListEditor {
      width: 100%;
      height: 150px;
      margin-bottom: 10px;
      font-size: 12px;
      border: 1px solid var(--border-color);
      padding: 8px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      background-color: #fff;
      border-radius: 6px;
      box-sizing: border-box;
      line-height: 1.5;
    }
    #urlListEditor:focus {
      outline: 2px solid var(--focus-ring);
      border-color: transparent;
    }
    .valid-url { color: var(--text-main); }
    .invalid-url { background-color: var(--invalid-bg); color: var(--invalid-text); border-radius: 3px; }
    button {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      font-weight: 500;
      transition: background-color 0.2s ease;
    }
    .action-button {
      margin-bottom: 10px;
      background-color: var(--accent-green);
      color: white;
    }
    .action-button:hover {
      background-color: var(--accent-green-hover);
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
      opacity: 0.7;
    }
    #status {
      font-size: 12px;
      text-align: center;
      min-height: 20px;
      color: var(--text-main);
      margin-bottom: 10px;
    }
    .ai-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      gap: 8px;
      background-color: #f7f6ed;
      padding: 8px;
      border-radius: 6px;
    }
    .ai-toggle label {
      cursor: pointer;
    }
    hr {
      border: none;
      border-top: 1px solid var(--border-color);
      margin: 20px 0;
    }
    .section-title {
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 10px;
    }
    #optionsButton {
      background-color: #9e9e9e;
      color: white;
    }
    #optionsButton:hover {
      background-color: #8c8c8c;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="logo.jpg" alt="Logo">
    <h3>Bulk Scraper</h3>
  </div>

  <div id="urlListEditor" contenteditable="true" spellcheck="false"></div>
  <button id="getAllTabsButton" class="action-button">Copy All Tab URLs</button>

  <div id="status">Enter URLs to begin.</div>

  <div class="ai-toggle">
    <input type="checkbox" id="aiCleanCheckbox" name="aiClean">
    <label for="aiCleanCheckbox">Clean with AI ✨</label>
  </div>

  <button id="startButton" class="action-button">Start Scraping</button>

  <hr>

  <h3 class="section-title">Single Page Scraper</h3>
  <button id="scrapeCurrentButton" class="action-button">Save Current Page's Text</button>

  <hr>

  <button id="optionsButton">⚙️ Settings</button>

  <script src="popup.js"></script>
</body>
</html>
