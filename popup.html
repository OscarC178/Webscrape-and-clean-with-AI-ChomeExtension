<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 350px; font-family: sans-serif; padding: 10px; }
    h3 { text-align: center; margin-top: 0; }
    /* New styles for the rich text editor */
    #urlListEditor {
      width: 95%;
      height: 150px;
      margin-bottom: 10px;
      font-size: 12px;
      border: 1px solid #ccc;
      padding: 5px;
      overflow-y: auto;
      white-space: pre-wrap; /* Allows line breaks */
      word-wrap: break-word;
    }
    #urlListEditor:focus {
        outline: 2px solid #007bff;
        border-color: transparent;
    }
    .valid-url { color: black; }
    .invalid-url { background-color: #ffdddd; color: #d8000c; text-decoration: underline; }

    button { width: 100%; padding: 10px; font-size: 14px; cursor: pointer; }
    .action-button { margin-bottom: 10px; }
    button:disabled { background-color: #cccccc; cursor: not-allowed; }
    #status { font-size: 12px; text-align: center; min-height: 20px; color: #555; }
    .ai-toggle { margin-bottom: 10px; text-align: center; }
  </style>
</head>
<body>
  <h3>Bulk Scraper</h3>
  <!-- Replaced textarea with a contenteditable div -->
  <div id="urlListEditor" contenteditable="true" spellcheck="false"></div>

  <button id="getAllTabsButton" class="action-button">Copy All Tab URLs</button>

  <div id="status">Enter URLs to begin.</div>

  <div class="ai-toggle">
    <input type="checkbox" id="aiCleanCheckbox" name="aiClean">
    <label for="aiCleanCheckbox">Clean with AI</label>
  </div>

  <button id="startButton" class="action-button">Start Scraping</button>

  <hr style="margin: 15px 0;">

  <h3>Single Page Scraper</h3>
  <button id="scrapeCurrentButton">Save Current Page's Text</button>
  
  <script src="popup.js"></script>
</body>
</html>
